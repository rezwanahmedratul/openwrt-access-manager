# ==============================================================================
# OpenWrt Access Manager — CI/CD Pipeline
# ==============================================================================
# Triggers:
#   • Pull requests → lint & type-check only
#   • Push to main  → lint, build Docker image, push to GHCR, deploy via SSH
#
# Required GitHub Secrets:
#   NEXT_PUBLIC_SUPABASE_URL            — Supabase project URL
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY — Supabase anon/publishable key
#   DEPLOY_SSH_HOST                     — Server IP or hostname
#   DEPLOY_SSH_USER                     — SSH username on the server
#   DEPLOY_SSH_KEY                      — Private SSH key (ed25519 or RSA)
#   DEPLOY_SSH_PORT (optional)          — SSH port, defaults to 22
#   SUPABASE_SERVICE_ROLE_KEY           — Supabase service role key (on server)
#   ROUTER_SECRET                       — Router auth token (on server)
# ==============================================================================

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint & Type-check
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx --no-install tsc --noEmit

  # ──────────────────────────────────────────────
  # Job 2: Build & Push Docker Image to GHCR
  # ──────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Job 3: Deploy to Server via SSH
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -e

            # ── Authenticate with GHCR ──
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── Pull latest image ──
            echo "🔄 Pulling latest image..."
            export GHCR_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker pull "${GHCR_IMAGE}"

            # ── Navigate to project directory ──
            cd ~/access-manager

            # ── Restart services with production compose ──
            echo "🚀 Restarting services..."
            GHCR_IMAGE="${GHCR_IMAGE}" docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # ── Cleanup old images ──
            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deployment complete!"
